name: ForgeCore CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-portable:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate MinePack specs
        run: npm run specs:generate

      - name: Materialize Obey outputs
        run: npm run specs:materialize:obey

      - name: Test Obey outputs
        run: npm run test:specs:obey

      - name: Materialize MindUnset outputs
        run: npm run specs:materialize:mind_unset

      - name: Test MindUnset outputs
        run: npm run test:specs:mind_unset

      - name: Verify MinePack specs bundle
        run: npm run specs:verify

      - name: Generate CI architect key
        run: |
          node -e "
          const crypto = require('crypto');
          const fs = require('fs');
          const pair = crypto.generateKeyPairSync('ed25519');
          const pem = pair.privateKey.export({ type: 'pkcs8', format: 'pem' });
          fs.writeFileSync('core/architect.key', pem, { encoding: 'utf8' });
          console.log('[CI] architect.key generated for build signing');
          "

      - name: Install Wine for cross-platform build
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 > /dev/null 2>&1

      - name: Build portable
        run: npm run build:portable

      - name: Generate release manifest
        run: node scripts/release_portable.cjs

      - name: Verify artifact
        run: npm run verify:portable

      - name: Verify release hash chain
        run: npm run verify:release

      - name: Generate update metadata
        run: npm run update:metadata:portable

      - name: Build dist publish metadata
        run: node scripts/publish_portable_bundle.cjs

      - name: Verify dist release/feed alignment
        run: npm run release:align:dist:stable

      - name: Upload verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: forgecore-verification
          path: |
            dist/release-manifest.json
            dist/*.sha256.txt
            dist/artifact_hashes.txt
            dist/specs-manifest.json
            dist/specs-manifest.signatures.json
            dist/specs-manifest.sig.stub.json
            dist/release-feed-alignment.json

  e2e-tests:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            NeuralOS_Master_Build/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install NeuralOS dependencies
        working-directory: NeuralOS_Master_Build
        run: npm ci
        env:
          HUSKY: "0"

      - name: Install renderer asset dependencies
        working-directory: NeuralOS_Master_Build
        run: |
          npm --prefix packages/modules/xxxplorer ci
          npm --prefix packages/shells/winshadow ci
        env:
          HUSKY: "0"

      - name: Build renderer assets
        working-directory: NeuralOS_Master_Build
        run: npm run build:assets

      - name: Rebuild native modules for Electron
        working-directory: NeuralOS_Master_Build
        run: npm run rebuild
        env:
          HUSKY: "0"

      - name: Run Playwright E2E tests
        working-directory: NeuralOS_Master_Build
        run: npm run test:e2e:ci
        env:
          CI: true
          NODE_ENV: test
          ELECTRON_ENABLE_LOGGING: true
          ELECTRON_ENABLE_STACK_DUMPING: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            NeuralOS_Master_Build/playwright-report/
            NeuralOS_Master_Build/test-results/
          retention-days: 14

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: NeuralOS_Master_Build/package-lock.json

      - name: Install NeuralOS dependencies
        working-directory: NeuralOS_Master_Build
        run: npm ci
        env:
          HUSKY: "0"

      - name: Run ESLint
        working-directory: NeuralOS_Master_Build
        run: npx eslint .
