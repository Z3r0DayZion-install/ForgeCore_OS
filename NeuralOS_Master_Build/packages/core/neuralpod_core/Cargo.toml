[package]
name = "neuralpod_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "neuralpod_core"
crate-type = ["cdylib"]

[dependencies]
neon = "1.0.0"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libp2p = { version = "0.53", features = ["dns", "mdns", "tcp", "noise", "yamux", "async-std"] }
futures = "0.3"
