<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Forge | EVENT HORIZON</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #9d00ff;
            --bg-black: #050505;
        }

        body {
            margin: 0;
            background: var(--bg-black);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .hud-overlay {
            position: relative;
            z-index: 10;
            pointer-events: none;
            width: 90%;
            height: 90%;
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .title {
            font-size: 24px;
            letter-spacing: 5px;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            pointer-events: auto;
        }

        .node-card {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--neon-cyan);
            padding: 15px;
            clip-path: polygon(0 0, 90% 0, 100% 20%, 100% 100%, 10% 100%, 0 80%);
            transition: 0.3s;
        }

        .node-card:hover {
            box-shadow: 0 0 15px var(--neon-cyan);
            transform: translateY(-5px);
        }

        .label {
            font-size: 10px;
            color: rgba(0, 243, 255, 0.5);
            text-transform: uppercase;
        }

        .value {
            font-size: 18px;
            color: white;
            margin-top: 5px;
        }

        .footer {
            display: flex;
            justify-content: center;
            color: var(--neon-purple);
            font-size: 12px;
            letter-spacing: 2px;
        }

        /* Mock 3D Globe Placeholder */
        .globe-placeholder {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 2px dashed var(--neon-purple);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .pulse {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--neon-cyan);
            animation: pulse-bloom 2s infinite;
        }

        @keyframes pulse-bloom {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div id="canvas-container">
        <!-- WebGL would render here -->
        <div style="display: flex; justify-content: center; align-items: center; height: 100%;">
            <div class="globe-placeholder"></div>
            <div class="pulse" style="top: 40%; left: 45%;"></div>
            <div class="pulse" style="top: 60%; left: 55%;"></div>
        </div>
    </div>

    <div class="hud-overlay">
        <div class="header">
            <div class="title">EVENT_HORIZON // META_SOVEREIGNTY</div>
            <div class="node-card" style="width: 200px;">
                <div class="label">System Pulse</div>
                <div class="value">STABLE_3.0.0</div>
            </div>
        </div>

        <div class="status-grid">
            <div class="node-card">
                <div class="label">Mesh Nodes</div>
                <div class="value" id="node-count">1,024 ACTIVE</div>
            </div>
            <div class="node-card">
                <div class="label">Entropy Flux</div>
                <div class="value">0.9999 HOLOGRAPHIC</div>
            </div>
            <div class="node-card">
                <div class="label">Singularity Status</div>
                <div class="value">META_CONVERGENCE_OK</div>
            </div>
        </div>

        <div class="footer">
            THE FORGE IS ETERNAL | NO LIMITS | SIGNATURE: v4.0.0
        </div>
    </div>

    <script>
        // Real-time animation logic
        setInterval(() => {
            const count = Math.floor(Math.random() * 50) + 1000;
            document.getElementById('node-count').innerText = count.toLocaleString() + ' ACTIVE';
        }, 3000);
    </script>
</body>

</html>
