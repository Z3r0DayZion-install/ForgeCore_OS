[package]
name = "vipn_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "vipn_core"
crate-type = ["cdylib"]

[dependencies]
neon = "1.0.0"
tokio = { version = "1.36", features = ["full"] }
windows-sys = { version = "0.52.0", features = ["Win32_Networking", "Win32_Security", "Win32_Foundation", "Win32_NetworkManagement"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
